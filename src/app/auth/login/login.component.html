<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

  <div>
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      placeholder="tú@ejemplo.com"
    />
    <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
      <small *ngIf="loginForm.get('email')?.errors?.['required']">
        El email es obligatorio.
      </small>
      <small *ngIf="loginForm.get('email')?.errors?.['email']">
        Ingresa un email válido.
      </small>
    </div>
  </div>

  <div>
    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      placeholder="Mínimo 6 caracteres"
    />
    <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
      <small *ngIf="loginForm.get('password')?.errors?.['required']">
        La contraseña es obligatoria.
      </small>
      <small *ngIf="loginForm.get('password')?.errors?.['minlength']">
        Debe tener al menos 6 caracteres.
      </small>
    </div>
  </div>

  <button type="submit" [disabled]="loginForm.invalid">
    Iniciar sesión
  </button>

</form>
