<h2>Subir nuevo informe</h2>
<div *ngIf="errorMsg" class="error">{{ errorMsg }}</div>

<input type="file" accept="application/pdf" (change)="onFileChange($event)" />
<button (click)="onSubmit()">Subir</button>
<div *ngIf="uploading" class="loading">Subiendo...</div>
<div *ngIf="uploadSuccess" class="success">Informe subido correctamente.</div>
