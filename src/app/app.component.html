<!-- src/app/app.component.html -->
<mat-sidenav-container class="app-container" autosize>
  <mat-sidenav #sidenav mode="side" opened class="app-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/"       (click)="sidenav.close()">Home</a>
      <a mat-list-item routerLink="/pdfs"   (click)="sidenav.close()">Mis Reportes</a>
      <a mat-list-item routerLink="/login"  (click)="sidenav.close()">Login</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Portal Reportes</span>
    </mat-toolbar>

    <div class="app-content">
      <!-- Aquí es donde cargan tus rutas -->
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
