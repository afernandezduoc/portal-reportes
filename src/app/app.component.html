<!-- src/app/app.component.html -->
<mat-sidenav-container class="app-container" autosize>
  <mat-sidenav #sidenav mode="side" closed class="app-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLinkActive="active" routerLink="/"
         (click)="sidenav.close()">
        Home
      </a>

      <!-- Sólo muestro “Admin” si el usuario está en el grupo Admin -->
      <ng-container *ngIf="isAdmin$ | async">
        <a mat-list-item routerLinkActive="active" routerLink="/admin" (click)="sidenav.close()">Admin</a>
      </ng-container>

      <a mat-list-item routerLinkActive="active" routerLink="/pdfs" (click)="sidenav.close()">
        Mis Reportes
      </a>

      <!-- Si NO estoy autenticado, muestro “Login” -->
      <ng-container *ngIf="!(isAuthenticated$ | async)">
        <a mat-list-item routerLink="/login"
           (click)="sidenav.close()">
          Login
        </a>
      </ng-container>

      <!-- Si estoy autenticado, muestro “Logout” -->
      <ng-container *ngIf="isAuthenticated$ | async">
        <a mat-list-item href="#" 
           (click)="logout(); sidenav.close()">
          Logout
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Portal Reportes</span>
    </mat-toolbar>

    <div class="app-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
