version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    # debe coincidir con el outputPath de tu angular.json
    baseDirectory: dist/portal-reportes/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
