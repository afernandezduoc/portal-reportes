version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
        - echo "─── ESTRUCTURA de dist/portal-reportes ───"
        - ls -R dist/portal-reportes
  artifacts:
    baseDirectory: dist/portal-reportes/browser
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
